# =============================================================================
# Milestone 3.4: Temporal Attention Residual LSTM Forecasting Configuration
# =============================================================================
pipeline_version: "3.4.0"
model_name: "attention_lstm_residual"
project_name: "AI-Powered Prediction of Global Supply Chain Logistics Bottlenecks"

model:
  model_type: "TemporalAttentionLSTMForecaster"
  input_size: 20
  hidden_size: 64
  attention_dim: 32
  num_layers: 2
  dropout: 0.2
  roll7_idx: 12
  roll7_mean: 2.4068180554238894
  roll7_std: 6.3483944613159915
  constraint: "relu"

training:
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  loss_type: "huber"
  huber_delta: 1.0
  num_epochs: 1
  early_stopping_patience: 2
  random_seed: 42
  device: "mps"
  num_workers: 0
  pin_memory: false

paths:
  pipeline_config: "DL/ml engineer/configs/sequence_pipeline.yaml"
  artifacts_dir: "DL/ml engineer/artifacts/attention_lstm"
  best_model: "DL/ml engineer/artifacts/attention_lstm/best_model.pt"
  training_history: "DL/ml engineer/artifacts/attention_lstm/training_history.csv"
  checkpoint_metadata: "DL/ml engineer/artifacts/attention_lstm/checkpoint_metadata.json"
  validation_predictions: "DL/ml engineer/artifacts/attention_lstm/validation_predictions.parquet"

